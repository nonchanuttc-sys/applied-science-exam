const NOTE_TEXT = "กรรมการคุมสอบจะจัดที่นั่งสอบให้แก่นักศึกษาอีกครั้ง";

function normName(s) {
  if (!s) return "";
  return (s + "")
    .normalize("NFC")
    .replace(/\s+/g, "")
    .toLowerCase();
}

function escapeHtml(s) {
  return (s ?? "").toString()
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function render(rows, qRaw) {
  const out = document.getElementById("out");
  out.innerHTML = "";

  if (!qRaw || qRaw.trim().length === 0) {
    out.innerHTML = `<p class="small">ยังไม่ได้พิมพ์ชื่อสำหรับค้นหา</p>`;
    return;
  }

  const q = normName(qRaw);
  const matched = rows.filter(r => r.stdname_norm === q);

  if (matched.length === 0) {
    out.innerHTML = `<p class="nores">ไม่พบข้อมูลของชื่อ: <b>${escapeHtml(qRaw)}</b> (ลองตรวจสอบการสะกด/เว้นวรรค)</p>`;
    return;
  }

  // sort by day then time
  matched.sort((a,b)=> {
    const d = (a.exdate_sort || "").localeCompare(b.exdate_sort || "");
    if (d !== 0) return d;
    return (a.extime_sort || 0) - (b.extime_sort || 0);
  });

  const name = matched[0].stdname;
  out.innerHTML += `<div class="namebadge">ผลการค้นหา: <b>${escapeHtml(name)}</b> — พบ ${matched.length} รายการ</div>`;
  out.innerHTML += `
  <table>
    <thead>
      <tr>
        <th style="width: 32%;">วันสอบ</th>
        <th style="width: 12%;">รหัสวิชา</th>
        <th style="width: 26%;">ชื่อวิชา</th>
        <th style="width: 8%;">ตอนเรียน</th>
        <th style="width: 14%;">เวลาสอบ</th>
        <th style="width: 8%;">ห้องสอบ</th>
      </tr>
    </thead>
    <tbody>
      ${matched.map(r => `
        <tr>
          <td>${escapeHtml(r.exdate)}</td>
          <td>${escapeHtml(r.courseid)}</td>
          <td>${escapeHtml(r.coursename)}</td>
          <td>${escapeHtml(r.coursesec)}</td>
          <td>${escapeHtml(r.extime)}</td>
          <td>${escapeHtml(r.exroom)}</td>
        </tr>
      `).join("")}
    </tbody>
  </table>
  <div class="note"><b>หมายเหตุ:</b> ${escapeHtml(NOTE_TEXT)}</div>
  `;
}

function doSearch() {
  const q = document.getElementById("q").value;
  render(DATA, q);
}

document.getElementById("btn").addEventListener("click", doSearch);
document.getElementById("q").addEventListener("keydown", (e)=>{ if(e.key==="Enter") doSearch(); });
document.getElementById("clear").addEventListener("click", ()=>{
  document.getElementById("q").value="";
  document.getElementById("out").innerHTML="";
  document.getElementById("q").focus();
});

render(DATA, "");
</script>
