function norm(s){return (s??"").toString().normalize("NFC").replace(/\s+/g,"").toLowerCase()}
function esc(s){return (s??"").toString().replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function search(){
 const raw=document.getElementById("q").value.trim(),out=document.getElementById("out"); out.innerHTML="";
 if(!raw)return;
 const q=norm(raw),qid=raw.replace(/\s+/g,"");
 let matches=DATA.filter(r=>r.stdname_norm.includes(q)||r.stdid.includes(qid));
 if(!matches.length){out.innerHTML='<div class="error">ไม่พบข้อมูล กรุณาตรวจสอบชื่อ นามสกุล หรือรหัสนักศึกษา</div>';return}
 const people=[...new Set(matches.map(r=>r.stdid+"|"+r.stdname))];
 if(people.length>1){out.innerHTML='<div class="error">พบมากกว่า 1 รายชื่อ กรุณาพิมพ์ชื่อให้ละเอียดขึ้น หรือใช้รหัสนักศึกษา</div>';return}
 matches.sort((a,b)=>{const dc=a.exdate_sort.localeCompare(b.exdate_sort); if(dc!==0)return dc; return Number(a.extime_sort)-Number(b.extime_sort)});
 const r0=matches[0];
 out.innerHTML=`<div class="result-head"><b>${esc(r0.stdname)}</b> &nbsp; รหัสนักศึกษา ${esc(r0.stdid)}</div>
 <div class="table-wrap"><table><thead><tr><th>วันสอบ</th><th>รหัสวิชา</th><th>ชื่อวิชา</th><th>ตอนเรียน</th><th>เวลาสอบ</th><th>ห้องสอบ</th></tr></thead>
 <tbody>${matches.map(r=>`<tr><td>${esc(r.exdate)}</td><td>${esc(r.courseid)}</td><td>${esc(r.coursename)}</td><td>${esc(r.coursesec)}</td><td>${esc(r.extime)}</td><td>${esc(r.exroom)}</td></tr>`).join("")}</tbody></table></div>
 <div class="note"><b>หมายเหตุ:</b> กรรมการคุมสอบจะจัดที่นั่งสอบให้แก่นักศึกษาอีกครั้ง</div>`;
}
document.getElementById("searchBtn").onclick=search;
document.getElementById("clearBtn").onclick=()=>{document.getElementById("q").value="";document.getElementById("out").innerHTML="";document.getElementById("q").focus()};

</script>
